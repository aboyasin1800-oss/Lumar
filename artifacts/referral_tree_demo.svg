        <rect x="0" y="0" width="58" height="58" rx="12" fill="#7E22CE" stroke="#E9D5FF" stroke-width="2" transform="rotate(45 29 29)"/>
        <text x="29" y="34" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Tahoma, Arial, sans-serif" transform="rotate(-45 29 34)">فرع 1-1-1</text>
      </g>

      <g transform="translate(245,500)">
        <rect x="0" y="0" width="58" height="58" rx="12" fill="#7E22CE" stroke="#E9D5FF" stroke-width="2" transform="rotate(45 29 29)"/>
        <text x="29" y="34" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Tahoma, Arial, sans-serif" transform="rotate(-45 29 34)">فرع 1-2-1</text>
      </g>

      <g transform="translate(620,500)">
        <rect x="0" y="0" width="58" height="58" rx="12" fill="#7E22CE" stroke="#E9D5FF" stroke-width="2" transform="rotate(45 29 29)"/>
        <text x="29" y="34" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Tahoma, Arial, sans-serif" transform="rotate(-45 29 34)">فرع 2-1-1</text>
      </g>

      <g transform="translate(735,500)">
        <rect x="0" y="0" width="58" height="58" rx="12" fill="#7E22CE" stroke="#E9D5FF" stroke-width="2" transform="rotate(45 29 29)"/>
        <text x="29" y="34" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Tahoma, Arial, sans-serif" transform="rotate(-45 29 34)">فرع 2-2-1</text>
      </g>

      <g transform="translate(1115,500)">
        <rect x="0" y="0" width="58" height="58" rx="12" fill="#7E22CE" stroke="#E9D5FF" stroke-width="2" transform="rotate(45 29 29)"/>
        <text x="29" y="34" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Tahoma, Arial, sans-serif" transform="rotate(-45 29 34)">فرع 3-1-1</text>
      </g>
    </g>

    <!-- Level 4 cyan circles -->
    <g>
      <circle cx="160" cy="640" r="26" fill="#0E7490" stroke="#A5F3FC" stroke-width="2"/>
      <text x="160" y="646" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="700" font-family="Tahoma, Arial, sans-serif">ن 1</text>

      <circle cx="250" cy="640" r="26" fill="#0E7490" stroke="#A5F3FC" stroke-width="2"/>
      <text x="250" y="646" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="700" font-family="Tahoma, Arial, sans-serif">ن 2</text>

      <circle cx="620" cy="640" r="26" fill="#0E7490" stroke="#A5F3FC" stroke-width="2"/>
      <text x="620" y="646" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="700" font-family="Tahoma, Arial, sans-serif">ن 3</text>

      <circle cx="740" cy="640" r="26" fill="#0E7490" stroke="#A5F3FC" stroke-width="2"/>
      <text x="740" y="646" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="700" font-family="Tahoma, Arial, sans-serif">ن 4</text>

      <circle cx="1115" cy="640" r="26" fill="#0E7490" stroke="#A5F3FC" stroke-width="2"/>
      <text x="1115" y="646" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="700" font-family="Tahoma, Arial, sans-serif">ن 5</text>
    </g>
  </g>

  <!-- Legend / controls -->
  <g transform="translate(1160, 780)">
    <rect x="0" y="0" width="315" height="130" rx="18" fill="#0F172A" stroke="#475569" stroke-width="2" opacity="0.9"/>
    <text x="25" y="34" fill="#F8FAFC" font-size="20" font-weight="700" font-family="Tahoma, Arial, sans-serif">التحكم</text>
    <text x="25" y="64" fill="#A5F3FC" font-size="18" font-family="Tahoma, Arial, sans-serif">Alt + =  تكبير</text>
    <text x="25" y="92" fill="#A5F3FC" font-size="18" font-family="Tahoma, Arial, sans-serif">Alt + -  تصغير</text>
    <text x="25" y="120" fill="#A5F3FC" font-size="18" font-family="Tahoma, Arial, sans-serif">الأسهم : تحريك الشجرة</text>
  </g>

  <!-- Stylized zoom buttons in top-right similar to app -->
  <g transform="translate(1380, 195)">
    <rect x="0" y="0" width="128" height="96" rx="20" fill="#111827" opacity="0.75" stroke="#475569"/>
    <g>
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#1E293B" stroke="#94A3B8"/>
      <text x="38" y="46" text-anchor="middle" fill="#F8FAFC" font-size="28" font-weight="700">+</text>
      <rect x="70" y="18" width="40" height="40" rx="12" fill="#1E293B" stroke="#94A3B8"/>
      <text x="90" y="46" text-anchor="middle" fill="#F8FAFC" font-size="28" font-weight="700">−</text>
      <rect x="44" y="66" width="40" height="18" rx="8" fill="#1E293B" stroke="#94A3B8"/>
      <circle cx="64" cy="75" r="4.5" fill="#F8FAFC"/>
    </g>
  </g>
</svg>
