      <text x="350" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 1-3</text>

      <circle cx="635" cy="430" r="38" fill="#C2410C" stroke="#FDBA74" stroke-width="3"/>
      <text x="635" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 2-1</text>

      <circle cx="740" cy="430" r="38" fill="#C2410C" stroke="#FDBA74" stroke-width="3"/>
      <text x="740" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 2-2</text>

      <circle cx="845" cy="430" r="38" fill="#C2410C" stroke="#FDBA74" stroke-width="3"/>
      <text x="845" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 2-3</text>

      <circle cx="1120" cy="430" r="38" fill="#C2410C" stroke="#FDBA74" stroke-width="3"/>
      <text x="1120" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 3-1</text>

      <circle cx="1220" cy="430" r="38" fill="#C2410C" stroke="#FDBA74" stroke-width="3"/>
      <text x="1220" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 3-2</text>

      <circle cx="1320" cy="430" r="38" fill="#C2410C" stroke="#FDBA74" stroke-width="3"/>
      <text x="1320" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 3-3</text>
