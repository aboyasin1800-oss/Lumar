      <text x="170" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 1-1</text>

      <circle cx="260" cy="430" r="38" fill="#C2410C" stroke="#FDBA74" stroke-width="3"/>
      <text x="260" y="438" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 1-2</text>

