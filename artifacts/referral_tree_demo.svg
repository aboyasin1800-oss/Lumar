<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="url(#bgGrad)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1600" height="90" fill="#1E293B"/>
  <text x="120" y="58" fill="#F8FAFC" font-size="28" font-family="Tahoma, Arial, sans-serif" font-weight="700">مخطط شجرة التسلسل التجاري</text>

  <!-- Search bar -->
  <rect x="120" y="120" width="1360" height="70" rx="14" fill="#334155"/>
  <circle cx="170" cy="155" r="14" fill="#F59E0B" opacity="0.9"/>
  <text x="200" y="163" fill="#E2E8F0" font-size="22" font-family="Tahoma, Arial, sans-serif">ابحث باسم العميل، الكود، أو الهاتف...</text>

  <!-- Tree area -->
  <g transform="translate(70,210)">
    <!-- Connection lines -->
    <g stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="740" y1="120" x2="740" y2="185"/>
      <line x1="740" y1="185" x2="260" y2="275"/>
      <line x1="740" y1="185" x2="740" y2="275"/>
      <line x1="740" y1="185" x2="1220" y2="275"/>

      <line x1="260" y1="275" x2="170" y2="395"/>
      <line x1="260" y1="275" x2="260" y2="395"/>
      <line x1="260" y1="275" x2="350" y2="395"/>

      <line x1="740" y1="275" x2="635" y2="395"/>
      <line x1="740" y1="275" x2="740" y2="395"/>
      <line x1="740" y1="275" x2="845" y2="395"/>

      <line x1="1220" y1="275" x2="1120" y2="395"/>
      <line x1="1220" y1="275" x2="1220" y2="395"/>
      <line x1="1220" y1="275" x2="1320" y2="395"/>
    </g>

    <!-- Root node -->
    <g filter="url(#shadow)">
      <rect x="650" y="20" width="180" height="110" rx="22" fill="#1E3A8A" stroke="#FBBF24" stroke-width="4"/>
      <text x="740" y="62" text-anchor="middle" fill="#FBBF24" font-size="18" font-weight="700" font-family="Tahoma, Arial, sans-serif">A1</text>
      <text x="740" y="87" text-anchor="middle" fill="#E5E7EB" font-size="11" font-family="Tahoma, Arial, sans-serif">(الرئيسي)</text>
      <line x1="670" y1="96" x2="810" y2="96" stroke="#FBBF24" stroke-width="2"/>
      <text x="740" y="115" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="Tahoma, Arial, sans-serif">العميل الرئيسي</text>
    </g>

    <!-- Level 1 green circles -->
    <g>
      <circle cx="260" cy="310" r="48" fill="#15803D" stroke="#86EFAC" stroke-width="3"/>
      <text x="260" y="318" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 1</text>

      <circle cx="740" cy="310" r="48" fill="#15803D" stroke="#86EFAC" stroke-width="3"/>
      <text x="740" y="318" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 2</text>

      <circle cx="1220" cy="310" r="48" fill="#15803D" stroke="#86EFAC" stroke-width="3"/>
      <text x="1220" y="318" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Tahoma, Arial, sans-serif">فرع 3</text>
